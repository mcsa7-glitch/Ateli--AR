//  ATUALIZA CONTADOR
async function atualizarContadorCarrinho() {

  try {

    const id_usuario =
      localStorage.getItem("id_usuario");

    if (!id_usuario) return;

    const resposta = await fetch(
      `http://localhost:3000/carrinho/${id_usuario}`
    );

    const carrinho =
      await resposta.json();

    const contador =
      document.getElementById("contadorCarrinho");

    if (contador) {

      contador.innerText =
        carrinho.length;

    }

  } catch (erro) {

    console.log(
      "Erro contador:",
      erro
    );

  }

}


//  CARREGAR PRODUTOS
document.addEventListener("DOMContentLoaded", function () {

  atualizarContadorCarrinho();

  const titulo =
    document.querySelector(".titulo-produtos");

  titulo.textContent =
    "Chaveiros";

  fetch(
    "http://localhost:3000/produtos/categoria/chaveiros"
  )

    .then(res => res.json())

    .then(produtos => {

      const lista =
        document.getElementById("lista-produtos");

      function getImageUrl(img){
        if(!img) return "../imagens/placeholder.png";
        if(img.startsWith("/uploads")) return `http://localhost:3000${img}`;
        if(img.startsWith("http")) return img;
        if(img.startsWith("/")) return img;
        return `../imagens/${img}`;
      }

      let html = "";

      produtos.forEach(produto => {

        html += `

        <div class="produto">

          <a
            href="produto-detalhe.html?id=${produto.id}"
            class="link-produto"
          >

            <img
              src="${getImageUrl(produto.imagem)}"
            >

            <h3>
              ${produto.nome}
            </h3>

            <p class="preco">

              ${Number(produto.preco).toLocaleString(
                "pt-BR",
                {
                  style: "currency",
                  currency: "BRL"
                }
              )}

            </p>

          </a>

          <!-- QUANTIDADE -->

          <div class="quantidade">

            <button
              type="button"
              class="menos"
            >
              -
            </button>

            <span class="quantidade-numero">
              0
            </span>

            <button
              type="button"
              class="mais"
            >
              +
            </button>

          </div>

          <!-- BOTÃO CARRINHO -->

          <button
            type="button"
            class="btn-carrinho"
            data-id="${produto.id}"
          >
            Adicionar ao carrinho
          </button>

        </div>

        `;

      });

      lista.innerHTML = html;

    })

    .catch(erro => {

      console.log(
        "Erro ao carregar produtos:",
        erro
      );

    });

});


// =====================================
// CLIQUES DOS BOTÕES
// =====================================

document.addEventListener(

  "click",

  async function (e) {

    // BOTÃO MAIS
    if (e.target.classList.contains("mais")) {

      const box =
        e.target.parentElement;

      const numero =
        box.querySelector(
          ".quantidade-numero"
        );

      let quantidade =
        Number(numero.textContent);

      quantidade++;

      numero.textContent =
        quantidade;

    }

    // BOTÃO MENOS
    if (e.target.classList.contains("menos")) {

      const box =
        e.target.parentElement;

      const numero =
        box.querySelector(
          ".quantidade-numero"
        );

      let quantidade =
        Number(numero.textContent);

      quantidade--;

      if (quantidade < 0) {

        quantidade = 0;

      }

      numero.textContent =
        quantidade;

    }

    // ADICIONAR AO CARRINHO
    if (
      e.target.classList.contains(
        "btn-carrinho"
      )
    ) {

      const produto =
        e.target.closest(".produto");

      const id_produto =
        e.target.dataset.id;

      const id_usuario =
        localStorage.getItem(
          "id_usuario"
        );

      // VERIFICA LOGIN
      if (!id_usuario) {

        alert(
          "Você precisa estar logado!"
        );

        return;

      }

      // PEGA QUANTIDADE
      const quantidade = Number(

        produto
          .querySelector(
            ".quantidade-numero"
          )
          .textContent

      );

      // NÃO DEIXA ADICIONAR 0
      if (quantidade === 0) {

        alert(
          "Adicione uma quantidade."
        );

        return;

      }

      try {

        const resposta = await fetch(

          "http://localhost:3000/carrinho/adicionar",

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              id_usuario,
              id_produto,
              quantidade

            })

          }

        );

        const mensagem =
          await resposta.text();

        alert(mensagem);

        atualizarContadorCarrinho();

        // VOLTA PARA 0
        produto
          .querySelector(
            ".quantidade-numero"
          )
          .textContent = 0;

      } catch (erro) {

        console.log(
          "Erro ao adicionar:",
          erro
        );

      }

    }

  }

);


// PERFIL
document.getElementById("btnPerfil")

.addEventListener("click", function(e){

  e.preventDefault();

  const id =
    localStorage.getItem(
      "id_usuario"
    );

  if(id){

    window.location.href =
      "../html/perfil.html";

  } else {

    window.location.href =
      "../html/login.html";

  }

});
