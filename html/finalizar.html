<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Finalizar Compra</title>

  <link rel="stylesheet" href="../css/finalizar.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<a href="../html/carrinho.html" class="back-button">
  <i class="fa-solid fa-arrow-left"></i> Voltar
</a>

<img src="../imagens/logo.png" class="logo-topo" alt="Logo">

<div class="container">

  <h1>Finalizar Compra</h1>

  <div id="listaCarrinho"></div>

  <h2 id="total">Total: R$ 0.00</h2>

  <!-- DADOS -->
  <input type="text" id="nome" placeholder="Seu nome">

  <input
    type="text"
    id="cpf"
    placeholder="CPF"
    maxlength="14"
  >

  <!-- ENDEREÇO -->
  <h3 class="titulo-endereco">Endereço</h3>

  <div class="endereco-box">

    <!-- CEP -->
    <input
      type="text"
      id="cep"
      placeholder="CEP"
      maxlength="9"
      readonly
    >

    <!-- Rua -->
    <input
      type="text"
      id="rua"
      placeholder="Nome da rua"
    >

    <!-- Número + Bairro -->
    <div class="linha-endereco">

      <input
        type="number"
        id="numero"
        placeholder="Número"
      >

      <input
        type="text"
        id="bairro"
        placeholder="Bairro"
      >

    </div>

    <!-- Complemento -->
    <input
      type="text"
      id="complemento"
      placeholder="Complemento (opcional)"
    >

  </div>

  

  <button id="finalizar">
    Finalizar Pedido
  </button>

</div>

<script>

async function carregarCarrinho() {

  try {

    const resposta = await fetch(
      `https://ateli-ar.onrender.com/carrinho/${localStorage.getItem("id_usuario")}`
    );

    let carrinho = await resposta.json();

    let desmarcados =
      JSON.parse(localStorage.getItem("desmarcados"));

    const selecionados =
      JSON.parse(localStorage.getItem("selecionados"));

    if (!Array.isArray(desmarcados) && Array.isArray(selecionados)) {
      desmarcados = carrinho
        .filter(item => !selecionados.includes(item.id_item))
        .map(item => item.id_item);
      localStorage.setItem(
        "desmarcados",
        JSON.stringify(desmarcados)
      );
      localStorage.removeItem("selecionados");
    }

    if (!Array.isArray(desmarcados)) {
      desmarcados = [];
    }

    carrinho = carrinho.filter(
      produto => !desmarcados.includes(produto.id_item)
    );

    const lista =
      document.getElementById("listaCarrinho");

    const totalHTML =
      document.getElementById("total");

    lista.innerHTML = "";

    let total = 0;

    const frete =
      Number(localStorage.getItem("frete")) || 0;

    if (carrinho.length === 0) {

      lista.innerHTML = `<p>Nenhum produto selecionado</p>`;

      totalHTML.innerText = "Total: R$ 0.00";

      return;
    }

    carrinho.forEach(produto => {

      total += Number(produto.subtotal);

      lista.innerHTML += `
        <div class="produto">
          <p><strong>${produto.nome}</strong></p>
          <p>Quantidade: ${produto.quantidade}</p>
          <p>R$ ${Number(produto.subtotal).toFixed(2)}</p>
        </div>
      `;

    });

    const totalFinal = total + frete;

    totalHTML.innerText =
      `Total: R$ ${totalFinal.toFixed(2)}`;

  } catch (erro) {
    console.log(erro);
  }
}

carregarCarrinho();


// CPF
document.getElementById("cpf")
.addEventListener("input", (e) => {

  let valor =
    e.target.value
    .replace(/\D/g, "")
    .substring(0, 11);

  valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
  valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
  valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

  e.target.value = valor;

});


// CEP salvo
const cepSalvo = localStorage.getItem("cep");

if (cepSalvo) {
  document.getElementById("cep").value = cepSalvo;
}


// ENDEREÇO VIA CEP
async function preencherEndereco() {

  const cep =
    document.getElementById("cep")
    .value.replace(/\D/g, "");

  if (cep.length !== 8) return;

  try {

    const resposta =
      await fetch(`https://viacep.com.br/ws/${cep}/json/`);

    const dados = await resposta.json();

    document.getElementById("rua").value =
      dados.logradouro || "";

    document.getElementById("bairro").value =
      dados.bairro || "";

  } catch (erro) {
    console.log(erro);
  }

}

preencherEndereco();

function validarCPF(cpf) {

  cpf = cpf.replace(/\D/g, "");

  if (cpf.length !== 11) return false;

  // bloqueia CPFs iguais
  if (/^(\d)\1+$/.test(cpf)) return false;

  let soma = 0;
  let resto;

  for (let i = 1; i <= 9; i++) {
    soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
  }

  resto = (soma * 10) % 11;

  if (resto === 10 || resto === 11) {
    resto = 0;
  }

  if (resto !== parseInt(cpf.substring(9, 10))) {
    return false;
  }

  soma = 0;

  for (let i = 1; i <= 10; i++) {
    soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
  }

  resto = (soma * 10) % 11;

  if (resto === 10 || resto === 11) {
    resto = 0;
  }

  if (resto !== parseInt(cpf.substring(10, 11))) {
    return false;
  }

  return true;
}
// FINALIZAR PEDIDO (CORRIGIDO)
document.getElementById("finalizar")
.addEventListener("click", async () => {

  const botao =
    document.getElementById("finalizar");

  botao.disabled = true;
  botao.innerText = "Processando...";

  try {

    const frete =
      Number(localStorage.getItem("frete")) || 0;

    let desmarcados =
      JSON.parse(localStorage.getItem("desmarcados"));

    const selecionados =
      JSON.parse(localStorage.getItem("selecionados"));

    const respostaCarrinho =
      await fetch(
        `https://ateli-ar.onrender.com/carrinho/${localStorage.getItem("id_usuario")}`
      );

    let produtos = await respostaCarrinho.json();

    if (!Array.isArray(desmarcados) && Array.isArray(selecionados)) {
      desmarcados = produtos
        .filter(item => !selecionados.includes(item.id_item))
        .map(item => item.id_item);
      localStorage.setItem(
        "desmarcados",
        JSON.stringify(desmarcados)
      );
      localStorage.removeItem("selecionados");
    }

    if (!Array.isArray(desmarcados)) {
      desmarcados = [];
    }

    produtos = produtos.filter(
      produto => !desmarcados.includes(produto.id_item)
    );

    if (produtos.length === 0) {
      alert("Selecione algum produto");

      botao.disabled = false;
      botao.innerText = "Finalizar Pedido";
      return;
    }

    // 🔥 CORREÇÃO PRINCIPAL: calcular total aqui também
    let total = 0;

    produtos.forEach(produto => {
      total += Number(produto.subtotal);
    });

    const totalFinal = total + frete;

    const pedido = {

      produtos,

      nome: document.getElementById("nome").value,
      cpf: document.getElementById("cpf").value,
      cep: document.getElementById("cep").value,
      rua: document.getElementById("rua").value,
      numero: document.getElementById("numero").value,
      bairro: document.getElementById("bairro").value,
      complemento: document.getElementById("complemento").value,
      id_usuario: localStorage.getItem("id_usuario"),

      total: totalFinal,
      frete: Number(localStorage.getItem("frete")) || 0
    };
const cepLimpo = pedido.cep.replace(/\D/g, "");
   if (!pedido.nome.trim()) {

  alert("Preencha o nome");

  botao.disabled = false;
  botao.innerText = "Finalizar Pedido";
  return;
}

if (!pedido.cpf.trim()) {

  alert("Preencha o CPF");

  botao.disabled = false;
  botao.innerText = "Finalizar Pedido";
  return;
}

if (!validarCPF(pedido.cpf)) {

  alert("CPF inválido");

  botao.disabled = false;
  botao.innerText = "Finalizar Pedido";
  return;
}

if (!/^\d{8}$/.test(cepLimpo)) {

  alert("CEP inválido");

  botao.disabled = false;
  botao.innerText = "Finalizar Pedido";
  return;
}

if (!pedido.rua.trim()) {

  alert("Preencha a rua");

  botao.disabled = false;
  botao.innerText = "Finalizar Pedido";
  return;
}

if (!pedido.numero.trim()) {

  alert("Preencha o número");

  botao.disabled = false;
  botao.innerText = "Finalizar Pedido";
  return;
}

if (!pedido.bairro.trim()) {

  alert("Preencha o bairro");

  botao.disabled = false;
  botao.innerText = "Finalizar Pedido";
  return;
}

    const resposta =
      await fetch("https://ateli-ar.onrender.com/criar-pagamento", {

        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(pedido)

      });

    const dados = await resposta.json();

if (dados.init_point) {

  // LIMPA CARRINHO
 const itensComprados =
  produtos.map(produto => produto.id_item);

await fetch(
  "https://ateli-ar.onrender.com/carrinho/limpar-selecionados",
  {
    method: "DELETE",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      itens: itensComprados
    })
  }
);

  // mantém o estado de desmarcados enquanto o usuário estiver no checkout
  // para que, ao voltar do MercadoPago, os itens desmarcados não voltem marcados automaticamente

  window.location.href = dados.init_point;
}

  } catch (erro) {

    console.log(erro);

    alert("Erro ao criar pagamento");

    botao.disabled = false;
    botao.innerText = "Finalizar Pedido";
  }

});

</script>

</body>
</html>
