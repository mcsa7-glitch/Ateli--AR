<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Realizado com Sucesso</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="checkmark">
    <i class="fa-solid fa-check"></i>
</div>
    <h1>Pagamento Realizado com Sucesso!</h1>
    <p>Obrigado pela sua compra! Seu pedido foi confirmado e em breve você receberá uma confirmação por email.</p>
    <p>Você pode acompanhar o status do seu pedido na sua página de perfil.</p>
    <div class="botoes">
      <a href="../html/index.html" class="btn btn-primary">Ir para Home</a>
      <a href="../html/rastrear.html" class="btn btn-secondary">Meus Pedidos</a>
    </div>
  </div>
  <script>
    const status = new URLSearchParams(window.location.search).get("status");

  fetch(`https://ateli-ar.onrender.com/admin/pedido/status/${localStorage.getItem("id_pedido")}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      id_usuario: Number(localStorage.getItem("id_usuario")),
      status: "pago"
    })
  });
  </script>
</body>
</html>
