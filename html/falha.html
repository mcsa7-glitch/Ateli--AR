<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Falhou</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: Arial, sans-serif;
    }
    .container {
      background: white;
      padding: 50px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 500px;
    }
    .error-icon {
      width: 80px;
      height: 80px;
      border: 4px solid #f44336;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 50px;
      color: #f44336;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .botoes {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background: #f44336;
      color: white;
    }
    .btn-primary:hover {
      background: #da190b;
    }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-icon">✕</div>
    <h1>Pagamento Não Autorizado</h1>
    <p>Desculpe, sua transação foi recusada. Verifique os dados do seu cartão e tente novamente.</p>
    <p>Se o problema persistir, entre em contato com sua instituição financeira.</p>
    <div class="botoes">
      <a href="../html/carrinho.html" class="btn btn-primary">Tentar Novamente</a>
      <a href="../html/index.html" class="btn btn-secondary">Ir para Home</a>
    </div>
  </div>
  <script>
   const status = new URLSearchParams(window.location.search).get("status");
   if (status === "falha") {
    fetch(`https://ateli-ar.onrender.com/admin/pedido/status/${localStorage.getItem("id_pedido")}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id_usuario: Number(localStorage.getItem("id_usuario")),
        status: "falha"
      })
    })
   }
  </script>
</body>
</html>
