<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Pendente</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="container">
   <div class="pending-icon">
   <i class="fa-solid fa-receipt"></i>
</div>
    <h1>Pagamento Pendente</h1>
    <p>Seu pagamento está sendo processado. Você receberá uma confirmação por email assim que for aprovado.</p>
    <p>Consulte o status do seu pedido na página de perfil.</p>
    <div class="botoes">
      <a href="../html/rastrear.html" class="btn btn-primary">Verificar Status</a>
      <a href="../html/index.html" class="btn btn-secondary">Ir para Home</a>
    </div>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get("status");
     fetch(`https://ateli-ar.onrender.com/admin/pedido/status/${localStorage.getItem("id_pedido")}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id_usuario: Number(localStorage.getItem("id_usuario")),
        status: "pendente"
      })
    });
  </script>
</body>
</html>
