<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Pendente</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: Arial, sans-serif;
    }
    .container {
      background: white;
      padding: 50px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 500px;
    }
    .pending-icon {
      width: 80px;
      height: 80px;
      border: 4px solid #ff9800;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 50px;
      color: #ff9800;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .botoes {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background: #ff9800;
      color: white;
    }
    .btn-primary:hover {
      background: #f57c00;
    }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pending-icon">⏳</div>
    <h1>Pagamento Pendente</h1>
    <p>Seu pagamento está sendo processado. Você receberá uma confirmação por email assim que for aprovado.</p>
    <p>Consulte o status do seu pedido na página de perfil.</p>
    <div class="botoes">
      <a href="../html/perfil.html" class="btn btn-primary">Verificar Status</a>
      <a href="../html/index.html" class="btn btn-secondary">Ir para Home</a>
    </div>
  </div>
</body>
</html>
