        <span>Calcular frete</span>
        <input type="text" id="cep" placeholder="Digite seu CEP" maxlength="9">
      </div>

      <button class="btn-frete" onclick="calcularFrete()">
        Calcular frete
      </button>
      <div class="linha">
  <span>Local</span>
  <span id="local">---</span>
</div>

      <!-- FRETE -->
      <div class="linha">
        <span>Frete</span>
        <span id="frete">R$ 0</span>
      </div>

      <!-- TOTAL -->
      <div class="linha total">
        <span>Total</span>
        <span id="total">R$ 0</span>
      </div>

<script>
document.getElementById("btnPerfil")
.addEventListener("click", function(e){
  e.preventDefault();

  const id = localStorage.getItem("id_usuario");

  if(id){
    window.location.href = "../html/perfil.html";
  } else {
    window.location.href = "../html/login.html";
  }
});
</script>

<script>

// máscara CEP
const cepInput = document.getElementById("cep");

cepInput.addEventListener("input", function(e){

  let valor = e.target.value;

  valor = valor.replace(/\D/g, "");

  valor = valor.substring(0, 8);

  valor = valor.replace(
    /^(\d{5})(\d)/,
    "$1-$2"
  );

  e.target.value = valor;

});

// verificar produtos
function temProdutos(){

  const itens =
  document.querySelectorAll(".selecionar-item:checked");

  return itens.length > 0;

}

// verificar frete
function freteCalculado(){

  const frete =
  document.getElementById("frete")
  .innerText;

  return frete !== "R$ 0";

}

// frete
async function calcularFrete(){

  if(!temProdutos()){

    alert(
      "Adicione produtos no carrinho!"
    );

    return;

  }

  const cep =
  document.getElementById("cep")
  .value
  .replace(/\D/g, "");

  // validar tamanho
  if(cep.length !== 8){

  document.getElementById("local")
  .innerHTML = "---";

  document.getElementById("frete")
  .innerHTML = "R$ 0";

  alert("CEP inválido!");

  return;
}

  try {

    const resposta =
    await fetch(
      `https://viacep.com.br/ws/${cep}/json/`
    );

    const dados =
    await resposta.json();

    // CEP não existe
    if(dados.erro){

  document.getElementById("local")
  .innerHTML = "---";

  document.getElementById("frete")
  .innerHTML = "R$ 0";

  const subtotalTexto =
    document.getElementById("subtotal")
    .innerText
    .replace("R$", "")
    .replace(",", ".");

  document.getElementById("total")
  .innerHTML =
  `R$ ${Number(subtotalTexto).toFixed(2)}`;

  alert("CEP não encontrado!");

  return;
}

    // mostrar local
    document.getElementById("local")
    .innerHTML =
    `${dados.localidade} - ${dados.uf}`;

    let frete = 0;

    if(dados.uf === "PE"){

      frete = 10;

    } else {

      frete = 20;

    }

    document.getElementById("frete")
    .innerHTML = `R$ ${frete}`;

    localStorage.setItem(
      "frete",
      frete
    );

    localStorage.setItem(
      "cep",
      cep
    );

    const subtotalTexto =
      document.getElementById("subtotal")
      .innerText
      .replace("R$", "")
      .replace(",", ".");

    const subtotal =
    Number(subtotalTexto);

    document.getElementById("total")
    .innerHTML =
    `R$ ${(subtotal + frete).toFixed(2)}`;

  } catch (erro) {

    console.log(erro);

    alert("Erro ao calcular frete!");

  }

}

// finalizar
document
.getElementById("finalizar")
.addEventListener("click", () => {

  if(!temProdutos()){

    alert(
      "Seu carrinho está vazio!"
    );

    return;

  }

  if(!freteCalculado()){

    alert(
      "Calcule o frete primeiro!"
    );

    return;

  }

  window.location.href =
  "../html/finalizar.html";

});

</script>
