<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil - Ateliê A R</title>

<link rel="stylesheet" href="../css/perfil.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<a href="../html/index.html" class="back-button">
  <i class="fa-solid fa-arrow-left"></i> Voltar
</a>

<img src="../imagens/logo.png" class="logo-topo" alt="Logo">

<div class="container">

    <button class="edit-button" id="editBtn" title="Editar Informações">
        <i class="fas fa-edit"></i>
    </button>

    <h1>Meu Perfil</h1>

    <div class="box">

        <!-- NOME -->
        <label>Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" readonly>

        <!-- TELEFONE -->
        <label>Telefone</label>
        <input id="telefone" type="text" onkeyup="formatarTelefone(this)" maxlength="15"
            placeholder="( ) _____-____" readonly>

        <!-- ENDEREÇO -->
        <label>Endereço</label>
        <input type="text" id="endereco" placeholder="Rua, número, bairro" readonly>

        <!-- EMAIL -->
        <label>Email</label>
        <input type="email" id="email" readonly>

        <!-- SENHA NOVA -->
<label id="labelSenha" style="display:none;">Nova senha</label>

<div class="senha-container" style="display:none;">
  <input type="password" id="senha" placeholder="Digite nova senha">

  <i class="fa-solid fa-eye" id="olhoSenha" style="cursor:pointer;"></i>
</div>

<!-- CONFIRMAR SENHA -->
<label id="labelConfirmarSenha" style="display:none;">Confirmar senha</label>

<div class="senha-container" style="display:none;">
  <input type="password" id="confirmarSenha" placeholder="Confirme a senha">

  <i class="fa-solid fa-eye" id="olhoConfirmarSenha" style="cursor:pointer;"></i>
</div>

        <!-- BOTÕES -->
        <div class="botoes">

            <button id="salvar" class="salvar" style="display:none;">
                Salvar Alterações
            </button>

            <button id="sair" class="sair">
                Sair da conta
            </button>

            <button id="excluir" class="excluir">
                Excluir Conta
            </button>

        </div>

    </div>
</div>

<script>
function formatarTelefone(input) {
  var telefone = input.value.replace(/\D/g, '');
  telefone = telefone.replace(/(\d{2})(\d{5})(\d{4})/, '($1)$2-$3');
  input.value = telefone;
}
</script>

<script src="../javaScript/perfil.js"></script>
<script src="../javaScript/menu.js"></script> 

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget({
        rootPath: 'https://vlibras.gov.br/app',
        position: 'BL'
    });
</script>

</body>
</html>
