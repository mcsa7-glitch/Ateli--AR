<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Ateliê A R</title>

<link rel="stylesheet" href="../css/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<a href="../html/index.html" class="back-button"> <i class="fa-solid fa-arrow-left"></i> Voltar</a>
<img src="../imagens/logo.png" class="logo-topo" alt="Logo">


<div class="container">

<div class="login-box">

    <h1>LOGIN</h1>

    <form id="formLogin">

       
        <label>Email</label>
        <input type="email" name="email" placeholder="Digite seu email" required>

        <label>Senha</label>
<div class="senha-box">
    <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
    <i class="fa-solid fa-eye" id="toggleSenha"></i>
</div>

       
        <p class="erro" style="display: none;">Email ou senha incorretos</p>


</div>
        <button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i>Entrar</button>

    </form>

    <div class="links">


        <p>Sem conta? 
            <a href="cadastro.html">CADASTRE-SE</a>
        </p>

    </div>

</div>

</div>

<script src="../javaScript/login.js"></script>



</body>
</html>
